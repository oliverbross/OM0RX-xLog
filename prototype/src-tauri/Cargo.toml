[package]
name = "xlog-prototype"
version = "0.4.0-alpha.3"
description = "Shared xLog desktop with integrated station and cluster services"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[profile.release]
# Avoid rust-objcopy LINKEDIT misalignment on current macOS toolchains.
# https://github.com/rust-lang/rust/issues/157750
strip = "none"

[profile.release.build-override]
debug = true
strip = "none"
