[package]
name = "xlog-prototype"
version = "1.2.18"
description = "Shared xLog desktop with integrated station and cluster services"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "=2.6.0"
serialport = { version = "4.9", default-features = false }
tempfile = "3.27"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[profile.release]
# Avoid rust-objcopy LINKEDIT misalignment on current macOS toolchains.
# https://github.com/rust-lang/rust/issues/157750
strip = "none"

[profile.release.build-override]
debug = true
strip = "none"
