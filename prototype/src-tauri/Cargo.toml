[package]
name = "xlog-prototype"
version = "0.1.0"
description = "Isolated xLog cross-platform architecture prototype"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Avoid rust-objcopy LINKEDIT misalignment on current macOS toolchains.
# https://github.com/rust-lang/rust/issues/157750
strip = "none"

[profile.release.build-override]
debug = true
strip = "none"
