name: Cross-platform beta qualification

on:
  workflow_dispatch:
    inputs:
      build_platforms:
        description: 'Native build and test targets'
        type: choice
        options: [macos, linux, windows, all]
        default: macos
      validation_only:
        description: 'Run native tests without producing application packages'
        type: boolean
        default: true
      package_macos:
        description: 'Produce a CI Mac bundle (public signed Mac releases are packaged separately)'
        type: boolean
        default: false
      runtime_run_id:
        description: 'Optional completed package run ID for runtime-only recheck (no rebuild)'
        required: false
        default: ''
      runtime_source_sha:
        description: 'Exact package commit SHA, required with runtime_run_id'
        required: false
        default: ''
      runtime_platform:
        description: 'Runtime-only recheck target'
        type: choice
        options: [both, linux, windows]
        default: both
  push:
    branches: [main, codex/unified-xlog-prototype-p1, codex/unified-xlog-integration-p2]
    paths: ['prototype/**', '!prototype/**/*.md', 'python/**', 'Sources/**', 'Tests/**', 'Package.swift', '.github/workflows/prototype.yml']
  pull_request:
    paths: ['prototype/**', '!prototype/**/*.md', 'python/**', 'Sources/**', 'Tests/**', 'Package.swift', '.github/workflows/prototype.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: beta-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_platforms || 'macos' }}
  cancel-in-progress: true

jobs:
  prototype:
    if: ${{ inputs.runtime_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.build_platforms == 'all' && '["macos-15", "ubuntu-24.04", "windows-2022"]' || inputs.build_platforms == 'linux' && '["ubuntu-24.04"]' || inputs.build_platforms == 'windows' && '["windows-2022"]' || '["macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-2022' && 120 || 90 }}
    steps:
      - name: Enable Windows checkout long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Select macOS Swift toolchain
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install supported contest Python before native tests
        uses: actions/setup-python@v5
        id: contest-python
        with:
          python-version: '3.12.4'
      - name: Restore native dependency/build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            prototype/src-tauri/target
            .build/prototype-tests
            .build/prototype-worker
          key: xlog-p1b-${{ runner.os }}-${{ hashFiles('prototype/src-tauri/Cargo.lock', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            xlog-p1b-${{ runner.os }}-${{ hashFiles('prototype/src-tauri/Cargo.lock', 'Package.swift') }}-
            xlog-p1b-${{ runner.os }}-
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libcurl4-openssl-dev libxml2-dev libicu-dev libssl-dev libudev-dev libsecret-1-dev pkg-config dbus-x11 gnome-keyring
      - name: Swift toolchain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz"
          toolchain="$RUNNER_TEMP/xlog-swift-6.3.3"
          curl --fail --location --retry 3 --output "$archive" https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          sha256sum "$archive"
          mkdir -p "$toolchain"
          tar -xzf "$archive" --strip-components=1 -C "$toolchain"
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"
      - name: Swift toolchain (Windows)
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Windows SQLite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sqlite3:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "XLOG_SQLITE_PREFIX=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
      - name: Record native toolchains
        run: |
          swift --version
          rustc --version
          node --version
      - name: Install frontend dependencies
        working-directory: prototype
        run: npm ci
      - name: Release payload guard tests
        run: |
          python3 prototype/scripts/test-release-payload.py
          python3 prototype/scripts/test-runtime-artifacts.py
          python3 prototype/scripts/test-hm-control-eol.py
          python3 prototype/scripts/test-contest-host-staging.py
          python3 prototype/scripts/test-linux-vault-harness.py
          python3 prototype/scripts/test-portable-swift-lock.py
      - name: Actual Linux QA process lifecycle regressions
        if: runner.os == 'Linux'
        run: python3 prototype/scripts/test-linux-process-receipts.py
      - name: Test atomic pinned contest catalog initialization
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python3 -m unittest discover -s python/tests -p test_store_catalog_seed.py -v
      - name: Parse Windows installer scripts and validate scope policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./prototype/scripts/test-installer-syntax.ps1
      - name: Linux C vault in a private Secret Service session
        id: linux_c_vault
        if: runner.os == 'Linux'
        run: python3 prototype/scripts/test-linux-vault.py
      - name: Compile portable native test fixtures early (Unix)
        if: runner.os != 'Windows'
        env:
          XLOG_PORTABLE_ONLY: '1'
          XLOG_CONTEST_PYTHON: ${{ steps.contest-python.outputs.python-path }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            python3 prototype/scripts/portable-swift-lock.py run -- swift build --force-resolved-versions --build-tests --scratch-path .build/prototype-tests --jobs 2
          else
            swift build --build-tests --scratch-path .build/prototype-tests --jobs 2
          fi
      - name: Compile portable native test fixtures early (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          XLOG_PORTABLE_ONLY: '1'
          XLOG_CONTEST_PYTHON: ${{ steps.contest-python.outputs.python-path }}
          XLOG_TEST_NATIVE_VAULT: '1'
        run: |
          python3 prototype/scripts/portable-swift-lock.py run -- swift build --force-resolved-versions --build-tests --scratch-path .build/prototype-tests --jobs 2 -Xcc "-I$env:XLOG_SQLITE_PREFIX/include" -Xlinker "/LIBPATH:$env:XLOG_SQLITE_PREFIX/lib"
          exit $LASTEXITCODE
      - name: Frontend tests and build
        working-directory: prototype
        env:
          XLOG_CONTEST_PYTHON: ${{ steps.contest-python.outputs.python-path }}
        run: npm test && npm run build
      - name: Test FLEX IQ loopback fixture (Mac)
        if: runner.os == 'macOS'
        env:
          XLOG_PORTABLE_ONLY: '1'
          XLOG_CONTEST_PYTHON: ${{ steps.contest-python.outputs.python-path }}
          XLOG_IQ_FIXTURE_DIAGNOSTICS: '1'
        run: swift test --scratch-path .build/prototype-tests --no-parallel --filter FlexIQSubscriptionTests
      - name: Test complete portable Swift core (Unix)
        if: runner.os != 'Windows'
        env:
          XLOG_PORTABLE_ONLY: '1'
          XLOG_CONTEST_PYTHON: ${{ steps.contest-python.outputs.python-path }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            python3 prototype/scripts/portable-swift-lock.py run -- swift test --force-resolved-versions --scratch-path .build/prototype-tests --no-parallel
          else
            swift test --scratch-path .build/prototype-tests --no-parallel
          fi
      - name: Test portable Swift core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          XLOG_PORTABLE_ONLY: '1'
          XLOG_CONTEST_PYTHON: ${{ steps.contest-python.outputs.python-path }}
          # Random fixture identities only, removed by the test's exact cleanup.
          XLOG_TEST_NATIVE_VAULT: '1'
        run: |
          python3 prototype/scripts/portable-swift-lock.py run -- swift test --force-resolved-versions --scratch-path .build/prototype-tests --no-parallel -Xcc "-I$env:XLOG_SQLITE_PREFIX/include" -Xlinker "/LIBPATH:$env:XLOG_SQLITE_PREFIX/lib"
          exit $LASTEXITCODE
      - name: Linux credential vault in a private Secret Service session
        if: ${{ always() && !cancelled() && runner.os == 'Linux' && steps.linux_c_vault.outcome == 'success' }}
        env:
          XLOG_PORTABLE_ONLY: '1'
          XLOG_CONTEST_PYTHON: ${{ steps.contest-python.outputs.python-path }}
        run: |
          python3 prototype/scripts/portable-swift-lock.py run -- swift build --force-resolved-versions --build-tests --scratch-path .build/prototype-tests
          python3 prototype/scripts/test-linux-vault.py --swift-tests --swift-scratch-path .build/prototype-tests
      - name: Build Swift worker (Unix)
        if: runner.os != 'Windows'
        run: bash prototype/scripts/build-worker.sh
      - name: Build Swift worker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./prototype/scripts/build-worker.ps1
      - name: Stage isolated worker
        run: node prototype/scripts/stage-worker.mjs
      - name: Build pinned Hamlib radio and rotor helpers (Mac integration)
        if: runner.os == 'macOS'
        run: bash prototype/scripts/stage-hamlib-macos.sh
      - name: Build pinned Hamlib radio and rotor helpers (Linux integration)
        if: runner.os == 'Linux'
        run: bash prototype/scripts/stage-hamlib-linux.sh
      - name: Stage pinned Hamlib radio and rotor helpers (Windows integration)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./prototype/scripts/stage-hamlib-windows.ps1
      - name: Test worker process framing (Unix)
        if: runner.os != 'Windows'
        run: node Tests/XLogPrototypeTests/worker-process.test.mjs prototype/src-tauri/target/release/xlog-prototype-worker
      - name: Test worker process framing (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node Tests/XLogPrototypeTests/worker-process.test.mjs prototype/src-tauri/target/release/xlog-prototype-worker.exe
          exit $LASTEXITCODE
      - name: Shell contract tests
        working-directory: prototype/src-tauri
        env:
          XLOG_TEST_PYTHON: ${{ steps.contest-python.outputs.python-path }}
        run: cargo test --locked
      - name: Bundled Hamlib dummy protocol and lifecycle tests
        if: runner.os != 'Windows'
        working-directory: prototype/src-tauri
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          XLOG_TEST_RIGCTLD="$PWD/binaries/rigctld-$target" XLOG_TEST_ROTCTLD="$PWD/binaries/rotctld-$target" cargo test --locked --test hamlib_dummy
      - name: Bundled Hamlib dummy protocol and lifecycle tests (Windows)
        if: runner.os == 'Windows'
        working-directory: prototype/src-tauri
        shell: pwsh
        run: |
          $env:XLOG_TEST_RIGCTLD = Join-Path $PWD 'binaries/rigctld-x86_64-pc-windows-msvc.exe'
          $env:XLOG_TEST_ROTCTLD = Join-Path $PWD 'binaries/rotctld-x86_64-pc-windows-msvc.exe'
          cargo test --locked --test hamlib_dummy
          exit $LASTEXITCODE
      - name: Build desktop executable (not an installer acceptance claim)
        working-directory: prototype
        run: npx tauri build --no-bundle
      - name: Collect resolved dependency inventory and notices
        run: node prototype/scripts/distribution-metadata.mjs
      - name: Package macOS application
        # PR/main gates build and test without minting another application
        # candidate under an already released version. Releases are explicit.
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && !inputs.validation_only && inputs.package_macos
        env:
          XLOG_PYTHON_FRAMEWORK: /Library/Frameworks/Python.framework
        run: |
          bash prototype/scripts/package-macos.sh
          ditto -c -k --sequesterRsrc --keepParent "prototype/src-tauri/target/release/bundle/macos/OM0RX-xLog.app" prototype/OM0RX-xLog-macOS.zip
      - name: Upload macOS package
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && !inputs.validation_only && inputs.package_macos
        uses: actions/upload-artifact@v4
        with:
          name: om0rx-xlog-macos-${{ github.sha }}
          if-no-files-found: error
          path: prototype/OM0RX-xLog-macOS.zip
      - name: Package Linux runtime and Debian application
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && !inputs.validation_only
        run: |
          python3 prototype/scripts/test-linux-runtime-permissions.py
          python3 prototype/scripts/test-linux-worker-framing.py
          bash prototype/scripts/package-linux.sh
      - name: Package Windows portable runtime
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && !inputs.validation_only
        shell: pwsh
        run: ./prototype/scripts/package-windows.ps1 -SkipBuild -OutputRoot "$env:RUNNER_TEMP/xlog-windows-package"
      - name: Package current-user and all-users EXE installers from one audited runtime
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && !inputs.validation_only
        shell: pwsh
        run: ./prototype/scripts/package-windows-installer.ps1 -PackageDirectory "$env:RUNNER_TEMP/xlog-windows-package/OM0RX-xLog-Prototype-windows-x86_64" -OutputDirectory "$env:RUNNER_TEMP/xlog-windows-installer"
      - name: Upload Linux runtime packages
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && !inputs.validation_only
        uses: actions/upload-artifact@v4
        with:
          name: xlog-runtime-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: prototype/dist-linux/
      - name: Upload Windows runtime package
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && !inputs.validation_only
        uses: actions/upload-artifact@v4
        with:
          name: xlog-runtime-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/xlog-windows-package/*.zip
            ${{ runner.temp }}/xlog-windows-package/*.zip.sha256
            ${{ runner.temp }}/xlog-windows-installer/*
      - name: Upload development executables and evidence inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlog-prototype-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            prototype/src-tauri/target/release/xlog-prototype
            prototype/src-tauri/target/release/xlog-prototype.exe
            prototype/src-tauri/target/release/xlog-prototype-worker*
            prototype/src-tauri/target/release/sqlite3.dll
            prototype/src-tauri/Cargo.lock
            prototype/package-lock.json
      - name: Upload portable Swift pin verification receipts
        if: ${{ always() && runner.os != 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-swift-pins-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .build/portable-swift-lock-receipts/*.json
      - name: Save native dependency/build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            prototype/src-tauri/target
            .build/prototype-tests
            .build/prototype-worker
          key: xlog-p1b-${{ runner.os }}-${{ hashFiles('prototype/src-tauri/Cargo.lock', 'Package.swift') }}-${{ github.sha }}
  linux-runtime:
    name: Linux runtime-only container acceptance
    needs: prototype
    if: ${{ always() && !cancelled() && ((inputs.runtime_run_id != '' && inputs.runtime_platform != 'windows') || (inputs.runtime_run_id == '' && needs.prototype.result == 'success' && (inputs.build_platforms == 'all' || inputs.build_platforms == 'linux') && !inputs.validation_only)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      XLOG_EXPECTED_PACKAGE_SOURCE_SHA: ${{ inputs.runtime_source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xlog-runtime-linux-${{ inputs.runtime_source_sha || github.sha }}
          path: prototype/dist-linux
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate private Linux evidence contracts
        run: python3 prototype/scripts/test-linux-evidence.py
      - name: Build runtime-only Ubuntu image with packaged deb
        run: |
          docker build -f prototype/scripts/Dockerfile.linux-runtime -t xlog-prototype-runtime .
          mkdir -p prototype/packaging-evidence/linux
          docker run --rm --network none --cap-drop ALL --entrypoint cat xlog-prototype-runtime /opt/om0rx-xlog-prototype/runtime-manifest.json > prototype/packaging-evidence/linux/runtime-manifest.json
          python3 -c 'import json,os; from pathlib import Path; m=json.loads(Path("prototype/packaging-evidence/linux/runtime-manifest.json").read_text()); assert m["commit"] == os.environ["XLOG_EXPECTED_PACKAGE_SOURCE_SHA"], "Linux package source differs from requested artifact"'
      - name: Native WebKit GUI, worker, relaunch and relocation with network disabled
        run: |
          mkdir -p prototype/packaging-evidence/linux
          chmod 777 prototype/packaging-evidence/linux
          docker image inspect xlog-prototype-runtime > prototype/packaging-evidence/linux/container-image.json
          docker run --rm --network none --cap-drop ALL -v "$PWD/prototype/packaging-evidence/linux:/evidence" xlog-prototype-runtime
          docker run --rm --network none --cap-drop ALL --entrypoint cat xlog-prototype-runtime /qa/installed-payload-scan.json > prototype/packaging-evidence/linux/installed-payload-scan.json
      - name: Recover private synthetic Linux report ownership
        if: always()
        run: |
          mkdir -p prototype/packaging-evidence/linux
          sudo python3 prototype/scripts/linux-evidence.py recover "$PWD/prototype/packaging-evidence/linux" "$(id -u)" "$(id -g)"
      - name: Upload native Linux reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlog-acceptance-linux-${{ inputs.runtime_source_sha || github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: prototype/packaging-evidence/linux/
  windows-runtime:
    name: Windows fresh-runner runtime acceptance (${{ matrix.installer_scope }})
    needs: prototype
    if: ${{ always() && !cancelled() && ((inputs.runtime_run_id != '' && inputs.runtime_platform != 'linux') || (inputs.runtime_run_id == '' && needs.prototype.result == 'success' && (inputs.build_platforms == 'all' || inputs.build_platforms == 'windows') && !inputs.validation_only)) }}
    strategy:
      fail-fast: false
      matrix:
        installer_scope: [currentUser, perMachine]
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      XLOG_EXPECTED_PACKAGE_SOURCE_SHA: ${{ inputs.runtime_source_sha || github.sha }}
      XLOG_INSTALLER_SCOPE: ${{ matrix.installer_scope }}
      XLOG_PACKAGE_RUN_ID: ${{ inputs.runtime_run_id || github.run_id }}
      XLOG_QA_EXECUTOR_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Enable Windows checkout long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Validate failed worker reply retention
        shell: pwsh
        run: |
          $evidence = "$env:RUNNER_TEMP/xlog-windows-installer-evidence"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $qaSource = (git rev-parse HEAD).Trim()
          if ($qaSource -ne $env:XLOG_QA_EXECUTOR_SOURCE_SHA -or $qaSource -notmatch '^[0-9a-f]{40}$' -or
              $env:XLOG_EXPECTED_PACKAGE_SOURCE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:XLOG_PACKAGE_RUN_ID -notmatch '^\d+$') {
            throw 'Runtime QA/package source identity is invalid.'
          }
          [ordered]@{
            schema = 1; qaExecutorSource = $qaSource
            packageSource = $env:XLOG_EXPECTED_PACKAGE_SOURCE_SHA; packageRunId = $env:XLOG_PACKAGE_RUN_ID
            installerScope = $env:XLOG_INSTALLER_SCOPE; applicationRebuiltInThisJob = $false
          } | ConvertTo-Json | Set-Content -LiteralPath "$evidence/qa-executor.json" -Encoding utf8NoBOM
          ./prototype/scripts/test-installer-syntax.ps1 -WorkerReceiptResultPath "$evidence/worker-receipt-contracts.json"
      - uses: actions/download-artifact@v4
        with:
          name: xlog-runtime-windows-${{ inputs.runtime_source_sha || github.sha }}
          path: ${{ runner.temp }}/xlog-runtime-download
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract isolated package
        shell: pwsh
        run: |
          # Multi-directory uploads preserve their common-parent subdirectories.
          $zips = @(Get-ChildItem "$env:RUNNER_TEMP/xlog-runtime-download" -Filter 'OM0RX-xLog-Prototype-windows-x86_64.zip' -File -Recurse)
          if ($zips.Count -ne 1) { throw 'Expected exactly one Windows portable ZIP' }
          $zip = $zips[0].FullName
          $expected = (Get-Content "$zip.sha256").Split(' ')[0].ToLowerInvariant()
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'ZIP checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/xlog-windows-accept"
          $provenance = Get-Content "$env:RUNNER_TEMP/xlog-windows-accept/OM0RX-xLog-Prototype-windows-x86_64/provenance.json" -Raw | ConvertFrom-Json -Depth 30
          if ($provenance.commit -ne $env:XLOG_EXPECTED_PACKAGE_SOURCE_SHA) { throw 'Windows package source differs from requested artifact' }
      - name: Native WebView2 GUI and worker without installing Swift
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP/xlog-windows-accept/OM0RX-xLog-Prototype-windows-x86_64"
          & "$package/accept-windows.ps1" -PackageDirectory $package -EvidenceDirectory "$env:RUNNER_TEMP/xlog-windows-evidence" -RequireNoSwiftToolchain
      - name: Verify shared payload and accept selected scope at its real default path
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "$env:RUNNER_TEMP/xlog-runtime-download" -Filter '*-setup.exe' -File -Recurse)
          if ($installers.Count -ne 2) { throw 'Expected current-user and all-users versioned Windows EXE installers' }
          $seenScopes = @{}
          foreach ($file in $installers) {
            $installer = $file.FullName
            $expected = (Get-Content "$installer.sha256").Split(' ')[0].ToLowerInvariant()
            if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'EXE checksum mismatch' }
            $provenance = Get-Content "$installer.provenance.json" -Raw | ConvertFrom-Json -Depth 20
            if ($provenance.schema -ne 2 -or $provenance.sourceCommit -ne $env:XLOG_EXPECTED_PACKAGE_SOURCE_SHA) { throw 'Windows installer source/schema differs from requested artifact' }
            $scope = $provenance.installation.mode
            if ($scope -notin @('currentUser', 'perMachine') -or $seenScopes.ContainsKey($scope)) { throw 'Expected one installer per scope' }
            $seenScopes[$scope] = $provenance
          }
          if ($seenScopes.currentUser.payloadManifestSHA256 -ne $seenScopes.perMachine.payloadManifestSHA256 -or
              $seenScopes.currentUser.mainExecutableSHA256 -ne $seenScopes.perMachine.mainExecutableSHA256) { throw 'Installer scopes do not share an identical audited payload' }
          # Each scope gets its own fresh runner. A data-preserving uninstall
          # intentionally retains location keys, which a fresh-install check rejects.
          $scope = $env:XLOG_INSTALLER_SCOPE
          $installer = ($installers | Where-Object Name -EQ $seenScopes[$scope].installer).FullName
          # Hosted runner is elevated: receipts explicitly leave ordinary-user/UAC qualification open.
          ./prototype/scripts/accept-windows-installer.ps1 -Installer $installer -EvidenceDirectory "$env:RUNNER_TEMP/xlog-windows-installer-evidence/$scope" -AllowElevatedHarness
      - name: Diagnose failed 1.5.20 installed local self-test with controlled temporary roots
        if: ${{ failure() && env.XLOG_EXPECTED_PACKAGE_SOURCE_SHA == '3d9cb0981c30764f1188db350ffebc22a5f328a7' }}
        shell: pwsh
        run: |
          $scope = $env:XLOG_INSTALLER_SCOPE
          $scopeEvidence = "$env:RUNNER_TEMP/xlog-windows-installer-evidence/$scope"
          $receiptPath = "$scopeEvidence/installer-acceptance.json"
          if (-not (Test-Path -LiteralPath $receiptPath)) {
            Write-Host 'No owned installer receipt; no diagnostic executable is launched.'
            exit 0
          }
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json -Depth 20
          if ($receipt.sourceCommit -ne $env:XLOG_EXPECTED_PACKAGE_SOURCE_SHA -or
              -not $receipt.defaultPathPassed -or -not $receipt.registryScopePassed -or -not $receipt.startMenuScopePassed) {
            Write-Host 'Default-path/scope ownership was not established; no diagnostic executable is launched.'
            exit 0
          }
          $working = "$scopeEvidence/native-runtime/synthetic-profile"
          ./prototype/scripts/diagnose-windows-local-self-test.ps1 `
            -PortableDirectory "$env:RUNNER_TEMP/xlog-windows-accept/OM0RX-xLog-Prototype-windows-x86_64" `
            -InstalledDirectory $receipt.actualDirectory -InstallerReceipt $receiptPath `
            -RunnerTemp $env:RUNNER_TEMP -OriginalNestedTemp "$working/Temp" -WorkingDirectory $working `
            -EvidenceDirectory "$scopeEvidence/local-self-test-diagnostic" -ABA
          # Keep both diagnostics in this step: GitHub changes inherited
          # GITHUB_ENV/OUTPUT/STATE and other coordinates between steps.
          $pairedPath = "$scopeEvidence/local-self-test-diagnostic/diagnostic.json"
          if (-not (Test-Path -LiteralPath $pairedPath)) {
            Write-Host 'No owned paired diagnostic; no RPC diagnostic executable is launched.'
            exit 0
          }
          $paired = Get-Content -LiteralPath $pairedPath -Raw | ConvertFrom-Json -Depth 40
          if ($paired.sourceCommit -ne $env:XLOG_EXPECTED_PACKAGE_SOURCE_SHA -or
              $paired.status -ne 'complete-diagnostic-not-acceptance' -or -not $paired.payloadsUnchangedAfterProbes) {
            Write-Host 'Paired diagnostic ownership/completion is unproven; no RPC executable is launched.'
            exit 0
          }
          $working = "$scopeEvidence/native-runtime/synthetic-profile"
          $receiptPath = "$scopeEvidence/installer-acceptance.json"
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json -Depth 20
          ./prototype/scripts/diagnose-windows-local-rpc.ps1 `
            -PortableDirectory "$env:RUNNER_TEMP/xlog-windows-accept/OM0RX-xLog-Prototype-windows-x86_64" `
            -InstalledDirectory $receipt.actualDirectory `
            -InstallerReceipt $receiptPath -PairedDiagnostic $pairedPath `
            -RunnerTemp $env:RUNNER_TEMP -OriginalNestedTemp "$working/Temp" -WorkingDirectory $working `
            -EvidenceDirectory "$scopeEvidence/local-rpc-diagnostic"
      - name: Upload native Windows reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlog-acceptance-windows-${{ matrix.installer_scope }}-${{ inputs.runtime_source_sha || github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/xlog-windows-evidence/
            ${{ runner.temp }}/xlog-windows-installer-evidence/
