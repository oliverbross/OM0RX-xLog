name: Contest portability

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sources/XContestCore/**'
      - 'Sources/XContestStore/**'
      - 'Sources/XLogPrototypeSupport/Contesting/**'
      - 'Sources/XLogPrototypeSupport/LiveWorker.swift'
      - 'Sources/XLogPrototypeSupport/LiveServiceMethods.swift'
      - 'Sources/XLogPrototypeSupport/LiveOnlineLogDeliveryService.swift'
      - 'Sources/XLogPrototypeSupport/LiveWSJTXBridge.swift'
      - 'Sources/XLogPrototypeWorker/main.swift'
      - 'Sources/CSQLitePrototype/**'
      - 'Tests/XContestCoreTests/**'
      - 'Tests/XContestStoreTests/**'
      - 'Tests/XLogPrototypeTests/Contest*Tests.swift'
      - 'Tests/XLogPrototypeTests/WorkerStartupTests.swift'
      - 'Tests/XLogPrototypeTests/LiveOnlineLogDeliveryServiceTests.swift'
      - 'Tests/XLogPrototypeTests/LiveWSJTXBridgeTests.swift'
      - 'Tests/XLogPrototypeTests/NativeDraftPowerCaptureTests.swift'
      - 'docs/contesting/fixtures/contest-export-worker-wire.json'
      - 'prototype/src-tauri/Cargo.lock'
      - 'prototype/src-tauri/Cargo.toml'
      - 'prototype/src-tauri/build.rs'
      - 'prototype/src-tauri/tauri.conf.json'
      - 'prototype/src-tauri/tauri.contesting-test.conf.json'
      - 'prototype/src-tauri/src/contest_export.rs'
      - 'prototype/src-tauri/src/main.rs'
      - 'prototype/src-tauri/src/operating_module.rs'
      - 'prototype/src-tauri/src/runtime_profile.rs'
      - 'prototype/src-tauri/src/worker.rs'
      - 'Sources/XStationIntegrationCore/ConnectionDoctor.swift'
      - 'Tests/XStationIntegrationTests/ConnectionDoctorTests.swift'
      - 'Sources/XLogPrototypeSupport/LiveFTPBackupPresentation.swift'
      - 'Sources/XLogPrototypeSupport/LiveRemoteBackupPresentation.swift'
      - 'Tests/XLogPrototypeTests/LiveRemoteBackupPresentationTests.swift'
      - 'Package.swift'
      - '.github/workflows/contest-portability.yml'
  pull_request:
    paths:
      - 'Sources/XContestCore/**'
      - 'Sources/XContestStore/**'
      - 'Sources/XLogPrototypeSupport/Contesting/**'
      - 'Sources/XLogPrototypeSupport/LiveWorker.swift'
      - 'Sources/CSQLitePrototype/**'
      - 'Tests/XContestCoreTests/**'
      - 'Tests/XContestStoreTests/**'
      - 'Tests/XLogPrototypeTests/Contest*Tests.swift'
      - 'docs/contesting/fixtures/contest-export-worker-wire.json'
      - 'prototype/src-tauri/Cargo.lock'
      - 'prototype/src-tauri/Cargo.toml'
      - 'prototype/src-tauri/build.rs'
      - 'prototype/src-tauri/tauri.conf.json'
      - 'prototype/src-tauri/tauri.contesting-test.conf.json'
      - 'prototype/src-tauri/src/contest_export.rs'
      - 'prototype/src-tauri/src/main.rs'
      - 'prototype/src-tauri/src/operating_module.rs'
      - 'prototype/src-tauri/src/runtime_profile.rs'
      - 'prototype/src-tauri/src/worker.rs'
      - 'Sources/XStationIntegrationCore/ConnectionDoctor.swift'
      - 'Tests/XStationIntegrationTests/ConnectionDoctorTests.swift'
      - 'Sources/XLogPrototypeSupport/LiveFTPBackupPresentation.swift'
      - 'Sources/XLogPrototypeSupport/LiveRemoteBackupPresentation.swift'
      - 'Tests/XLogPrototypeTests/LiveRemoteBackupPresentationTests.swift'
      - 'Package.swift'
      - '.github/workflows/contest-portability.yml'

permissions:
  contents: read

concurrency:
  group: contest-portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contest-tests:
    name: Contest tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    env:
      XLOG_PORTABLE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Select macOS Swift toolchain
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Linux SQLite dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Swift toolchain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz"
          toolchain="$RUNNER_TEMP/xlog-swift-6.3.3"
          curl --fail --location --retry 3 --output "$archive" https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          sha256sum "$archive"
          mkdir -p "$toolchain"
          tar -xzf "$archive" --strip-components=1 -C "$toolchain"
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"
      - name: Swift toolchain (Windows)
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Windows SQLite dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sqlite3:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "XLOG_SQLITE_PREFIX=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
      - name: Record native Swift toolchain
        run: swift --version
      - name: Verify contest test discovery (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          discovered="$(swift test list --jobs 2 --scratch-path .build/contest-platform)"
          printf '%s\n' "$discovered"
          test "$(printf '%s\n' "$discovered" | grep -c '^XContestCoreTests\.ContestCoreTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XContestCoreTests\.ContestCallHistoryTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XContestCoreTests\.ContestCallHistoryProjectionTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XContestStoreTests\.ContestStoreTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestADIFExportTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestNAQPADIFExportTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestARRLRTTYADIFExportTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestJIDXADIFExportTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestARRLDXADIFExportTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestJIDXWorkerWireTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestARRLDXWorkerWireTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestExportServiceTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestDeclarativeExportServiceTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestExportLaneTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestExportWorkerWireTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestingLaneTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestAssistanceLaneTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestSCPWorkerIntegrationTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestCallHistoryServiceTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.ContestCallHistoryWorkerTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.WorkerStartupTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.LiveOnlineLogDeliveryServiceTests/')" -ge 1
          test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.NativeDraftPowerCaptureTests/')" -ge 1
          if test "$(uname -s)" = Darwin; then
            test "$(printf '%s\n' "$discovered" | grep -c '^XLogPrototypeTests\.LiveWSJTXBridgeTests/')" -ge 1
          fi
      - name: Verify contest test discovery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $discovered = & swift test list --jobs 2 --scratch-path .build/contest-platform -Xcc "-I$env:XLOG_SQLITE_PREFIX/include" -Xlinker "/LIBPATH:$env:XLOG_SQLITE_PREFIX/lib" 2>&1
          if ($LASTEXITCODE -ne 0) { $discovered | Write-Output; exit $LASTEXITCODE }
          $discovered | Write-Output
          $core = @($discovered | Where-Object { $_ -match '^XContestCoreTests\.ContestCoreTests/' }).Count
          $callHistoryCore = @($discovered | Where-Object { $_ -match '^XContestCoreTests\.ContestCallHistoryTests/' }).Count
          $callHistoryProjection = @($discovered | Where-Object { $_ -match '^XContestCoreTests\.ContestCallHistoryProjectionTests/' }).Count
          $store = @($discovered | Where-Object { $_ -match '^XContestStoreTests\.ContestStoreTests/' }).Count
          $adif = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestADIFExportTests/' }).Count
          $naqpAdif = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestNAQPADIFExportTests/' }).Count
          $arrlRttyAdif = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestARRLRTTYADIFExportTests/' }).Count
          $jidxAdif = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestJIDXADIFExportTests/' }).Count
          $arrlDxAdif = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestARRLDXADIFExportTests/' }).Count
          $jidxWorker = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestJIDXWorkerWireTests/' }).Count
          $arrlDxWorker = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestARRLDXWorkerWireTests/' }).Count
          $service = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestExportServiceTests/' }).Count
          $declarativeExportService = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestDeclarativeExportServiceTests/' }).Count
          $lane = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestExportLaneTests/' }).Count
          $wire = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestExportWorkerWireTests/' }).Count
          $contestingLane = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestingLaneTests/' }).Count
          $assistanceLane = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestAssistanceLaneTests/' }).Count
          $scpWorker = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestSCPWorkerIntegrationTests/' }).Count
          $callHistoryService = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestCallHistoryServiceTests/' }).Count
          $callHistoryWorker = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.ContestCallHistoryWorkerTests/' }).Count
          $workerStartup = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.WorkerStartupTests/' }).Count
          $onlineDelivery = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.LiveOnlineLogDeliveryServiceTests/' }).Count
          $draftPower = @($discovered | Where-Object { $_ -match '^XLogPrototypeTests\.NativeDraftPowerCaptureTests/' }).Count
          if ($core -lt 1 -or $callHistoryCore -lt 1 -or $callHistoryProjection -lt 1 -or $store -lt 1 -or $adif -lt 1 -or $naqpAdif -lt 1 -or $arrlRttyAdif -lt 1 -or $jidxAdif -lt 1 -or $arrlDxAdif -lt 1 -or $jidxWorker -lt 1 -or $arrlDxWorker -lt 1 -or $service -lt 1 -or $declarativeExportService -lt 1 -or $lane -lt 1 -or $wire -lt 1 -or $contestingLane -lt 1 -or $assistanceLane -lt 1 -or $scpWorker -lt 1 -or $callHistoryService -lt 1 -or $callHistoryWorker -lt 1 -or $workerStartup -lt 1 -or $onlineDelivery -lt 1 -or $draftPower -lt 1) { throw "Expected contest test targets were not discovered." }
      - name: Test contest core, store, and export support (macOS and Linux)
        if: runner.os != 'Windows'
        run: |
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XContestCoreTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XContestStoreTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestADIFExportTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestNAQPADIFExportTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestARRLRTTYADIFExportTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestJIDXADIFExportTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestARRLDXADIFExportTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestJIDXWorkerWireTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestARRLDXWorkerWireTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestExportServiceTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestDeclarativeExportServiceTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestExportLaneTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestExportWorkerWireTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestingLaneTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestAssistanceLaneTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestSCPWorkerIntegrationTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestCallHistoryServiceTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.ContestCallHistoryWorkerTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.WorkerStartupTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.LiveOnlineLogDeliveryServiceTests
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.NativeDraftPowerCaptureTests
          if test "$(uname -s)" = Darwin; then
            swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.LiveWSJTXBridgeTests
          fi
      - name: Test contest core, store, and export support (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XContestCoreTests -Xcc "-I$env:XLOG_SQLITE_PREFIX/include" -Xlinker "/LIBPATH:$env:XLOG_SQLITE_PREFIX/lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XContestStoreTests -Xcc "-I$env:XLOG_SQLITE_PREFIX/include" -Xlinker "/LIBPATH:$env:XLOG_SQLITE_PREFIX/lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($filter in @('XLogPrototypeTests.ContestADIFExportTests', 'XLogPrototypeTests.ContestNAQPADIFExportTests', 'XLogPrototypeTests.ContestARRLRTTYADIFExportTests', 'XLogPrototypeTests.ContestJIDXADIFExportTests', 'XLogPrototypeTests.ContestARRLDXADIFExportTests', 'XLogPrototypeTests.ContestJIDXWorkerWireTests', 'XLogPrototypeTests.ContestARRLDXWorkerWireTests', 'XLogPrototypeTests.ContestExportServiceTests', 'XLogPrototypeTests.ContestDeclarativeExportServiceTests', 'XLogPrototypeTests.ContestExportLaneTests', 'XLogPrototypeTests.ContestExportWorkerWireTests', 'XLogPrototypeTests.ContestingLaneTests', 'XLogPrototypeTests.ContestAssistanceLaneTests', 'XLogPrototypeTests.ContestSCPWorkerIntegrationTests', 'XLogPrototypeTests.ContestCallHistoryServiceTests', 'XLogPrototypeTests.ContestCallHistoryWorkerTests', 'XLogPrototypeTests.WorkerStartupTests', 'XLogPrototypeTests.LiveOnlineLogDeliveryServiceTests', 'XLogPrototypeTests.NativeDraftPowerCaptureTests')) {
            swift test --jobs 2 --scratch-path .build/contest-platform --filter $filter -Xcc "-I$env:XLOG_SQLITE_PREFIX/include" -Xlinker "/LIBPATH:$env:XLOG_SQLITE_PREFIX/lib"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test Windows ConnectionDoctor boolean fallback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XStationIntegrationTests.ConnectionDoctorTests -Xcc "-I$env:XLOG_SQLITE_PREFIX/include" -Xlinker "/LIBPATH:$env:XLOG_SQLITE_PREFIX/lib"
          exit $LASTEXITCODE
      - name: Test Windows remote backup revision validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          swift test --jobs 2 --scratch-path .build/contest-platform --filter XLogPrototypeTests.LiveRemoteBackupPresentationTests -Xcc "-I$env:XLOG_SQLITE_PREFIX/include" -Xlinker "/LIBPATH:$env:XLOG_SQLITE_PREFIX/lib"
          exit $LASTEXITCODE

  contest-native-tests:
    name: Contest native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    env:
      CARGO_BUILD_JOBS: '2'
      TAURI_CONFIG: '{"productName":"OM0RX-xLog Contesting Test","identifier":"com.oliverbross.xlog.contesting-test","bundle":{"active":false,"externalBin":[]}}'
    steps:
      - uses: actions/checkout@v4
      - name: Linux Tauri compile dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libcurl4-openssl-dev libxml2-dev libicu-dev libssl-dev libudev-dev
      - name: Restore isolated native test cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/contest-native-target
          key: contest-native-${{ runner.os }}-${{ hashFiles('prototype/src-tauri/Cargo.lock') }}
      - name: Record Rust toolchain and verify Test config override
        shell: bash
        run: |
          rustc --version --verbose
          cargo --version --verbose
          node -e 'const c=JSON.parse(process.env.TAURI_CONFIG); if(c.productName!=="OM0RX-xLog Contesting Test"||c.identifier!=="com.oliverbross.xlog.contesting-test"||c.bundle?.active!==false||!Array.isArray(c.bundle?.externalBin)||c.bundle.externalBin.length!==0) process.exit(1)'
      - name: Discover and run bounded native contest tests
        if: runner.os != 'Windows'
        working-directory: prototype/src-tauri
        shell: bash
        run: |
          target="${{ runner.temp }}/contest-native-target"
          export_tests="$(cargo test --locked --jobs 2 --target-dir "$target" --bin xlog-prototype --features contesting-test contest_export::tests:: -- --list)"
          admission_tests="$(cargo test --locked --jobs 2 --target-dir "$target" --bin xlog-prototype --features contesting-test contesting_test_native_admission_tests:: -- --list)"
          passive_read_test="$(cargo test --locked --jobs 2 --target-dir "$target" --bin xlog-prototype --features contesting-test worker::tests::passive_reads_use_bounded_timeout_without_widening_mutation_policy -- --list)"
          module_tests="$(cargo test --locked --jobs 2 --target-dir "$target" --bin xlog-prototype --features contesting-test operating_module::tests:: -- --list)"
          shutdown_tests="$(cargo test --locked --jobs 2 --target-dir "$target" --bin xlog-prototype --features contesting-test worker::tests::shutdown_ -- --list)"
          printf '%s\n%s\n%s\n%s\n%s\n' "$export_tests" "$admission_tests" "$passive_read_test" "$module_tests" "$shutdown_tests"
          test "$(printf '%s\n' "$export_tests" | grep -c '^contest_export::tests::')" -ge 1
          test "$(printf '%s\n' "$admission_tests" | grep -c '^contesting_test_native_admission_tests::')" -eq 5
          test "$(printf '%s\n' "$passive_read_test" | grep -c '^worker::tests::passive_reads_use_bounded_timeout_without_widening_mutation_policy: test$')" -eq 1
          test "$(printf '%s\n' "$module_tests" | grep -c '^operating_module::tests::')" -ge 1
          test "$(printf '%s\n' "$shutdown_tests" | grep -c '^worker::tests::shutdown_')" -ge 1
          cargo test --locked --jobs 2 --target-dir "$target" --bin xlog-prototype --features contesting-test contest_export::tests::
          cargo test --locked --jobs 2 --target-dir "$target" --bin xlog-prototype --features contesting-test contesting_test_native_admission_tests::
          cargo test --locked --jobs 2 --target-dir "$target" --bin xlog-prototype --features contesting-test worker::tests::passive_reads_use_bounded_timeout_without_widening_mutation_policy
          cargo test --locked --jobs 2 --target-dir "$target" --bin xlog-prototype --features contesting-test operating_module::tests::
          cargo test --locked --jobs 2 --target-dir "$target" --bin xlog-prototype --features contesting-test worker::tests::shutdown_
      - name: Discover and run bounded native contest tests (Windows)
        if: runner.os == 'Windows'
        working-directory: prototype/src-tauri
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'contest-native-target'
          $filters = @(
            @{ Name = 'export'; Filter = 'contest_export::tests::'; Pattern = '^contest_export::tests::'; Count = 0 },
            @{ Name = 'admission'; Filter = 'contesting_test_native_admission_tests::'; Pattern = '^contesting_test_native_admission_tests::'; Count = 5 },
            @{ Name = 'passive read'; Filter = 'worker::tests::passive_reads_use_bounded_timeout_without_widening_mutation_policy'; Pattern = '^worker::tests::passive_reads_use_bounded_timeout_without_widening_mutation_policy: test$'; Count = 1 },
            @{ Name = 'operating module'; Filter = 'operating_module::tests::'; Pattern = '^operating_module::tests::'; Count = 0 },
            @{ Name = 'worker shutdown'; Filter = 'worker::tests::shutdown_'; Pattern = '^worker::tests::shutdown_'; Count = 6 }
          )
          foreach ($entry in $filters) {
            $discovered = & cargo test --locked --jobs 2 --target-dir $target --bin xlog-prototype --features contesting-test $entry.Filter -- --list 2>&1
            if ($LASTEXITCODE -ne 0) { $discovered | Write-Output; exit $LASTEXITCODE }
            $discovered | Write-Output
            $count = @($discovered | Where-Object { $_ -match $entry.Pattern }).Count
            if (($entry.Count -eq 0 -and $count -lt 1) -or ($entry.Count -ne 0 -and $count -ne $entry.Count)) { throw "Expected native contest $($entry.Name) tests were not discovered." }
            cargo test --locked --jobs 2 --target-dir $target --bin xlog-prototype --features contesting-test $entry.Filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
