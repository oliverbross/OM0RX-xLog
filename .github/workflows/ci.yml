name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build application targets without minting a release candidate
        run: swift build
      - name: Verify built resources
        run: |
          bundle="$(swift build --show-bin-path)/OM0RXXLog_XLogCore.bundle"
          for resource in \
            cty.csv \
            ham-award-jarl-entities.json \
            ham-award-jarl-prefectures.json \
            ham-award-wcsa-schools.json \
            ham-award-tools-LICENSE.md
          do
            test -n "$(find "$bundle" -type f -name "$resource" -print -quit)"
          done
