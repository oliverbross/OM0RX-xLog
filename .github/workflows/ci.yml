name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Package app
        run: ./scripts/package-app.sh
      - name: Verify packaged resources
        run: |
          bundle=dist/OM0RX-xLog.app/Contents/Resources/OM0RXXLog_XLogCore.bundle
          for resource in \
            cty.csv \
            ham-award-jarl-entities.json \
            ham-award-jarl-prefectures.json \
            ham-award-wcsa-schools.json \
            ham-award-tools-LICENSE.md
          do
            test -n "$(find "$bundle" -type f -name "$resource" -print -quit)"
          done
