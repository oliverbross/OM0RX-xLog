name: Native core diagnosis

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native host to validate without packaging
        type: choice
        options: [all, linux, windows, macos]
        default: all
      test_filter:
        description: Optional Swift test regex for a diagnostic subset; empty runs the full native suite
        type: string
        required: false
        default: ''
      draft_precision_phases:
        description: Apply observation-only UTC round-trip test markers (diagnostic only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["macos-15", "ubuntu-24.04", "windows-2022"]' || inputs.platform == 'linux' && '["ubuntu-24.04"]' || inputs.platform == 'windows' && '["windows-2022"]' || '["macos-15"]') }}
    runs-on: ${{ matrix.os }}
    # Native Windows debug fixtures measured ~30 minutes of test work plus
    # ~8 minutes compilation and toolchain setup, before Swift Testing runs.
    timeout-minutes: ${{ matrix.os == 'windows-2022' && 90 || 45 }}
    steps:
      - name: Enable Windows checkout long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Observe UTC round-trip boundaries without changing assertions
        if: inputs.draft_precision_phases
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tools/diagnostics/operator-draft-precision-phases.patch
          git apply --check tools/diagnostics/operator-draft-precision-phases.patch
          git apply tools/diagnostics/operator-draft-precision-phases.patch
          git diff --check
          test "$(git diff --name-only)" = 'Tests/XLogPrototypeTests/OperatorDraftReversalAcceptanceTests.swift'
      - name: Select macOS Swift toolchain
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12.4'
      - name: Restore Swift test build cache
        uses: actions/cache/restore@v4
        with:
          path: .build/prototype-tests
          key: xlog-core-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            xlog-core-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
            xlog-p1b-${{ runner.os }}-
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libcurl4-openssl-dev libxml2-dev libicu-dev libssl-dev libudev-dev libsecret-1-dev pkg-config dbus-x11 gnome-keyring
      - name: Swift toolchain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz"
          toolchain="$RUNNER_TEMP/xlog-swift-6.3.3"
          curl --fail --location --retry 3 --output "$archive" https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          sha256sum "$archive"
          mkdir -p "$toolchain"
          tar -xzf "$archive" --strip-components=1 -C "$toolchain"
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"
      - name: Swift toolchain (Windows)
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Windows SQLite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sqlite3:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "XLOG_SQLITE_PREFIX=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
      - name: Python archive and payload guard tests
        run: |
          python3 prototype/scripts/test-release-payload.py
          python3 prototype/scripts/test-runtime-artifacts.py
          python3 prototype/scripts/test-contest-host-staging.py
          python3 prototype/scripts/test-linux-vault-harness.py
          python3 prototype/scripts/test-portable-swift-lock.py
          python3 prototype/scripts/test-native-core-diagnostic.py
      - name: Parse Windows installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./prototype/scripts/test-installer-syntax.ps1
      - name: Linux C vault in a private Secret Service session
        id: linux_c_vault
        if: runner.os == 'Linux'
        run: python3 prototype/scripts/test-linux-vault.py
      - name: Complete portable Swift core (Unix)
        if: runner.os != 'Windows'
        env:
          XLOG_PORTABLE_ONLY: '1'
          XLOG_CONTEST_PYTHON: ${{ steps.python.outputs.python-path }}
          XLOG_SWIFT_TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            python3 prototype/scripts/native-core-diagnostic.py -- python3 prototype/scripts/portable-swift-lock.py run -- swift test --force-resolved-versions --scratch-path .build/prototype-tests --no-parallel
          else
            python3 prototype/scripts/native-core-diagnostic.py -- swift test --scratch-path .build/prototype-tests --no-parallel
          fi
      - name: Complete portable Swift core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          XLOG_PORTABLE_ONLY: '1'
          XLOG_CONTEST_PYTHON: ${{ steps.python.outputs.python-path }}
          XLOG_TEST_NATIVE_VAULT: '1'
          XLOG_SWIFT_TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          python3 prototype/scripts/native-core-diagnostic.py -- python3 prototype/scripts/portable-swift-lock.py run -- swift test --force-resolved-versions --scratch-path .build/prototype-tests --no-parallel -Xcc "-I$env:XLOG_SQLITE_PREFIX/include" -Xlinker "/LIBPATH:$env:XLOG_SQLITE_PREFIX/lib"
          exit $LASTEXITCODE
      - name: Linux Swift vault in a private Secret Service session
        if: ${{ always() && !cancelled() && runner.os == 'Linux' && steps.linux_c_vault.outcome == 'success' }}
        env:
          XLOG_PORTABLE_ONLY: '1'
        run: |
          python3 prototype/scripts/portable-swift-lock.py run -- swift build --force-resolved-versions --build-tests --scratch-path .build/prototype-tests
          python3 prototype/scripts/test-linux-vault.py --swift-tests --swift-scratch-path .build/prototype-tests
      - name: Upload native diagnostic selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-core-selection-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .build/native-core-diagnostics/*.json
      - name: Upload portable Swift pin verification receipts
        if: ${{ always() && runner.os != 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-swift-pins-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .build/portable-swift-lock-receipts/*.json
      - name: Save Swift test build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build/prototype-tests
          key: xlog-core-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
